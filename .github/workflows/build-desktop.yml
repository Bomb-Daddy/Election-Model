name: Build Windows and Linux desktop packages

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "packages/**"
      - "tests/**"
      - "src/**"
      - "package.json"
      - "index.html"
      - "vite.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 GUI install packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install free open-source dependencies
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Compile and test code
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Optional live VoteHub free API endpoint verification (separate from mock QA)
        continue-on-error: true
        run: node tests/integration/votehub-live.mjs
      - name: Build graphical Linux .deb and AppImage
        run: npm run package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Headed Electron GUI smoke test on packaged Linux app
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          ELECTION_EXECUTABLE="$PWD/release/linux-unpacked/election-analysis-workbench" xvfb-run -a node tests/e2e/desktop-smoke.mjs
      - name: Install actual Linux deb and launch installed application
        shell: bash
        run: |
          sudo apt-get install -y ./release/election-analysis-workbench_0.1.0_amd64.deb
          INSTALLED_BIN="/opt/Election Analysis Workbench/election-analysis-workbench"
          if [[ -z "$INSTALLED_BIN" || ! -x "$INSTALLED_BIN" ]]; then
            echo "::error::Installed Linux executable was not located."
            exit 1
          fi
          dpkg -L election-analysis-workbench | grep -E 'applications/|/bin/|\.desktop$' || true
          ELECTION_EXECUTABLE="$INSTALLED_BIN" xvfb-run -a node tests/e2e/desktop-smoke.mjs
      - name: Archive Linux GUI screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-workbench-linux-gui-evidence
          path: qa-artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: List package files and SHA-256 hashes
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print
          sha256sum release/*.deb release/*.AppImage > release/SHA256SUMS-linux.txt
          cat release/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: election-workbench-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-linux.txt
          retention-days: 3
          if-no-files-found: error

  windows:
    name: Windows 11 x64 one-click installer
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install free open-source dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Compile and test code
        shell: pwsh
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Build Windows NSIS .exe
        shell: pwsh
        run: npm run package:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Run packaged Windows Electron GUI smoke tests
        shell: pwsh
        run: |
          $env:ELECTION_EXECUTABLE = (Resolve-Path "release/win-unpacked/Election Analysis Workbench.exe").Path
          node tests/e2e/desktop-smoke.mjs
      - name: Install actual Windows NSIS and launch installed application
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter "*Setup*.exe" | Select-Object -First 1).FullName
          if (-not $setup) { throw "No Windows one-click installer executable found" }
          $result = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Windows NSIS install failed: exit $($result.ExitCode)" }
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Election Analysis Workbench.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Windows installed executable not found" }
          $env:ELECTION_EXECUTABLE = $installed.FullName
          node tests/e2e/desktop-smoke.mjs
      - name: Archive Windows GUI screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-workbench-windows-gui-evidence
          path: qa-artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Record package SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS-windows.txt
          Get-Content release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: election-workbench-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          retention-days: 3
          if-no-files-found: error

# Use ONLY standard public-repository runners. Never switch to premium/paid runners.
# This workflow produces packages but does not claim a real GUI install, one-click
# launch or nontechnical-user acceptance: those gates remain NOT TESTED until executed.
