name: Steve Deace complete Whisper transcript

on:
  push:
    branches:
      - osint-deace-pilot-2026-11-09
    paths:
      - .github/workflows/deace-full-transcript.yml

permissions:
  contents: read

jobs:
  validate_qa_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Run hostile gate regression tests
        run: python3 osint/test_transcript_hostile_qa_gate.py
  transcribe:
    needs: validate_qa_gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install faster-whisper
        run: python3 -m pip install --disable-pip-version-check faster-whisper huggingface-hub==0.35.3
      - name: Transcribe entire November 6 audio
        run: python3 osint/deace_full_transcribe.py
      - name: Mandatory hostile structural QA and independent review gate
        run: python3 osint/transcript_hostile_qa_gate.py transcript_out
      - name: Upload full transcript (short-lived, no audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deace-2026-11-06-whisper-complete
          path: |
            transcript_out/transcript.txt
            transcript_out/transcript.srt
            transcript_out/transcript_segments.json
            transcript_out/verification.json
            transcript_out/hostile_qa_report.json
            transcript_out/independent_audio_review_template.json
          retention-days: 1
          if-no-files-found: error
      - name: Show verified output statistics
        if: success()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("transcript_out/verification.json"))
          assert d["status"]=="complete_unreviewed"
          assert d["word_count"]>5000
          print("Complete transcription:",d["word_count"],"words",d["segments"],"segments")
          PY
